const clearTableWithCaptcha = function(id) {
    if (!confirm('እርግጠኛ ነዎት? ትዕዛዞቹ ይሰረዛሉ')) return;
    showCaptchaModal(async () => {
        await DB.loadAll();
        const t = DB.find('tables', id);
        if (!t) return;
        await DB.update('tables', id, {
            status: 'available',
            occupied_by: null,
            occupied_by_name: null
        });
        const orders = DB.get('orders').filter(o => o.table_number === t.table_number && !['delivered','voided'].includes(o.status));
        for (const o of orders) await DB.update('orders', o.id, { status: 'voided' });
        const sessions = DB.get('sessions').filter(s => s.table_number === t.table_number && s.status === 'active');
        for (const s of sessions) await DB.update('sessions', s.id, { status: 'closed', closed_at: new Date().toISOString() });
        await logActivity(currentUserId, 'table_cleared', `ጠረጴዛ ${t.table_number} አጽድቷል`);
        showNotif('✅ ጠረጴዛ አጽድቷል', 'success');
        goTo('tables');
    }, { id: id });
};

// ==================== SERVER SALES ====================
async function renderServerSales(c) {
    await DB.loadAll();
    const today = new Date().toISOString().split('T')[0];
    const serverSales = DB.get('serverSales').filter(s => s.date === today);
    const users = DB.get('users');
    const servers = users.filter(u => u.role === 'server' || u.role === 'cashier');

    const grouped = {};
    for (const sale of serverSales) {
        const key = sale.server_id || 'unknown';
        if (!grouped[key]) {
            grouped[key] = {
                server_id: key,
                server_name: sale.server_name || 'ያልታወቀ',
                totalSales: 0,
                totalOrders: 0,
                transactions: []
            };
        }
        grouped[key].totalSales += sale.amount || 0;
        grouped[key].totalOrders += sale.items || 1;
        grouped[key].transactions.push(sale);
    }

    const sorted = Object.values(grouped).sort((a,b) => b.totalSales - a.totalSales);
    const grandTotal = sorted.reduce((s, g) => s + g.totalSales, 0);

    let html = `<div class="card"><h3>📊 የአስተናጋጅ ሽያጭ - ${getEthDate()}</h3>
        <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">ጠቅላላ ሽያጭ: <strong style="color:var(--accent);">${grandTotal.toFixed(2)} ብር</strong></div>
        <div style="font-size:12px;color:var(--muted);">📋 ${serverSales.length} ግብይቶች</div>
    </div>`;

    if (sorted.length === 0) {
        html += '<div class="card">📋 ዛሬ ምንም ሽያጭ የለም</div>';
        c.innerHTML = html;
        return;
    }

    for (const server of sorted) {
        const isCurrentUser = server.server_id === currentUserId;
        const commission = server.totalSales * 0.05;
        html += `
            <div class="card server-sales" style="${isCurrentUser ? 'border-left-color:var(--ok);' : ''}">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                    <span style="font-weight:600;font-size:14px;">👨‍💼 ${server.server_name}</span>
                    <span class="total">${server.totalSales.toFixed(2)} ብር</span>
                </div>
                <div style="font-size:11px;color:var(--muted);">📋 ${server.transactions.length} ግብይቶች</div>
                <div style="font-size:11px;color:var(--ok);">💰 ኮሚሽን: ${commission.toFixed(2)} ብር</div>
                ${isCurrentUser ? '<div style="font-size:10px;color:var(--ok);">✅ የእርስዎ ሽያጭ</div>' : ''}
            </div>
        `;
    }

    if (['admin', 'manager', 'accountant'].includes(role)) {
        html += `<div class="card"><h3>📋 ዝርዝር ግብይቶች</h3>`;
        for (const sale of serverSales.slice(0, 20)) {
            const user = users.find(u => u.id === sale.server_id);
            html += `<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;">
                <span>${user ? user.full_name : 'ያልታወቀ'}</span>
                <span>🪑 ${sale.table_number || '-'}</span>
                <span style="color:var(--accent);font-weight:700;">${(sale.amount || 0).toFixed(2)} ብር</span>
            </div>`;
        }
        html += '</div>';
    }

    c.innerHTML = html;
}

            <button class="btn btn-primary btn-block" onclick="addProductWithCaptcha()">ጨምር</button>
        </div>`;
    }
    const holiday = getActiveHoliday();
    if (holiday) {
        html += `<div class="special-card"><span>🎉 <b>${holiday.name}</b> - ${holiday.discount}% ቅናሽ በሁሉም ምርቶች ላይ!</span></div>`;
    }
    for (const cat of cats) {
        const cp = prods.filter(p => p.category_id === cat.id);
        if (cp.length === 0) continue;
        html += `<div class="section-head" style="margin-top:14px;"><div><div class="eyebrow">${catIcon(cat.name)} ምድብ</div><h2 style="font-size:22px;">${cat.name}</h2></div></div><div class="pgrid">`;

const addProductWithCaptcha = function() {
    const name = document.getElementById('pName').value;
    const price = parseFloat(document.getElementById('pPrice').value);
    const cat = document.getElementById('pCat').value;
    const dest = document.getElementById('pDest').value;

        try {

};

// ==================== QR ====================
async function renderQR(c, tableNum) {
    const baseUrl = window.location.href.split('?')[0].split('#')[0];
    if (!tableNum) {
        await DB.loadAll();
        const tables = DB.get('tables');
        let html = '<div class="card"><h3>📱 QR ኮድ</h3><div class="grid-4">';
        for (const t of tables.sort((a,b) => parseInt(a.table_number) - parseInt(b.table_number))) {
            html += `<div class="table-item available" onclick="goTo('qr','${t.table_number}')" style="aspect-ratio:1;flex-direction:column;padding:3px;"><div style="font-size:20px;">📱</div><div class="num">${t.table_number}</div></div>`;
        }
        html += '</div></div>';
        c.innerHTML = html;
        return;
    }
    const url = `${baseUrl}?table=${tableNum}`;
    c.innerHTML = `<div class="card"><h3>📱 ጠረጴዛ ${tableNum}</h3>
        <div class="qr-box"><div id="qrContainer"></div><div class="num">🪑 ጠረጴዛ ${tableNum}</div></div>
        <button class="btn btn-secondary btn-sm btn-block" style="padding:9px;" onclick="downloadQR()">⬇ አውርድ</button>
        <button class="btn btn-secondary btn-sm btn-block" style="padding:9px;" onclick="goTo('qr')">← ዝርዝር</button>
        <button class="btn btn-secondary btn-sm btn-block" style="padding:9px;" onclick="shareMessage('📱 ጠረጴዛ ${tableNum} ላይ ነኝ! ኑ ተጋበዩ!')">📱 አጋራ</button>
    </div>`;
    setTimeout(() => {
        const container = document.getElementById('qrContainer');
        if (container) { container.innerHTML = ''; new QRCode(container, { text: url, width: 140, height: 140, colorDark: "#2a1c14", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H }); }
    }, 100);
}

function downloadQR() {
    const canvas = document.querySelector('#qrContainer canvas');
    if (!canvas) { showNotif('⚠️ QR ኮድ አልተገኘም', 'alert'); return; }
    const link = document.createElement('a');
    link.download = 'table_qr.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showNotif('✅ QR ተወርዷል', 'success');
}

const addPurchaseWithCaptcha = function() {
    const id = document.getElementById('purchaseItem').value;
    const qty = parseFloat(document.getElementById('purchaseQty').value);
    let price = parseFloat(document.getElementById('purchasePrice').value);
    if (!id || !qty) { showNotif('⚠️ ግብዓት እና ብዛት ያስገቡ', 'alert'); return; }
    showCaptchaModal(async () => {
        try {
            const rm = DB.find('rawMaterials', id);
            if (!rm) { showNotif('⚠️ ግብዓት አልተገኘም', 'alert'); return; }
            if (!price || price <= 0) price = rm.last_price || rm.unitPrice;
            rm.current_stock = (rm.current_stock || 0) + qty;
            rm.last_price = price;
            await DB.update('rawMaterials', id, { current_stock: rm.current_stock, last_price: price });
            await DB.add('purchases', { raw_material_id: id, quantity: qty, price: price, date: new Date().toISOString().split('T')[0] });
            await logActivity(currentUserId, 'purchase', `${rm.name} ${qty} ${rm.unit} ተገዝቷል`);
            showNotif('✅ ግዢ ተመዝግቧል!', 'success');
            render('purchases');
        } catch(e) { showNotif('⚠️ ስህተት: ' + e.message, 'alert'); }
    });
};

// ==================== RECIPES ====================
async function renderRecipes(c) {
    await DB.loadAll();
    const prods = DB.get('products').filter(p => !p.is_86);
    const raw = DB.get('rawMaterials');
    const cats = DB.get('categories');
    let html = `<div class="card"><h3>📝 ሪሲፒ</h3>
        <div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:4px;">
            <span class="filter-chip ${recipeFilter === 'all' ? 'active' : ''}" onclick="recipeFilter='all';render('recipes')">ሁሉም</span>
            ${cats.map(c => `<span class="filter-chip ${recipeFilter === c.id ? 'active' : ''}" onclick="recipeFilter='${c.id}';render('recipes')">${c.name}</span>`).join('')}
        </div>
    </div>`;
    const filtered = recipeFilter === 'all' ? prods : prods.filter(p => p.category_id === recipeFilter);
    for (const p of filtered) {
        const exclusions = DB.get('recipeExclusions').filter(e => e.product_id === p.id);
        const excludedIds = exclusions.map(e => e.raw_material_id);
        const yields = DB.get('recipeYields').filter(y => y.product_id === p.id);
        let totalCost = 0;
        for (const y of yields) {
            const rm = raw.find(r => r.id === y.raw_material_id);
            if (rm && y.units_per_product > 0 && !excludedIds.includes(rm.id)) {
                totalCost += (rm.last_price || rm.unitPrice) * (1 / y.units_per_product);
            }
        }
        const profit = p.base_price - totalCost;
        const catName = cats.find(c => c.id === p.category_id);
        html += `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
            <h3 style="margin:0;font-size:15px;">${p.name} <small style="color:var(--muted);font-size:10px;font-family:var(--sans);">(${catName ? catName.name : ''})</small></h3>
            <div class="cost-badge"><span>ወጪ: <span style="color:var(--ok);font-weight:700;">${totalCost.toFixed(2)} ብር</span></span><span>ትርፍ: ${profit.toFixed(2)} ብር</span></div>
        </div>
        <div style="margin-top:6px;">`;
        const included = raw.filter(rm => !excludedIds.includes(rm.id));
        if (included.length === 0) html += '<p style="color:var(--muted);font-size:11px;">ምንም ግብዓት የለም</p>';
        else {
            for (const rm of included) {
                const existing = yields.find(y => y.raw_material_id === rm.id);
                const val = existing ? existing.units_per_product : 0;
                html += `<div class="recipe-row"><span class="rname">${rm.name}</span>
                    <input type="number" value="${val}" onchange="updateYield('${p.id}','${rm.id}',this.value)" step="0.01">
                    <span>→ ${p.name}</span>
                    <button class="exclude-btn" onclick="excludeMat('${p.id}','${rm.id}')">✕</button>
                </div>`;
            }
        }
        const excluded = raw.filter(rm => excludedIds.includes(rm.id));
        if (excluded.length > 0) {
            html += '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--bad-bg);border-radius:10px;border:1px dashed rgba(181,71,58,0.3);">';

            html += '</div>';
        }
        html += '</div></div>';
    }

}

async function updateYield(pid, rid, val) {
    val = parseFloat(val) || 0;
    const yields = DB.get('recipeYields');
    const found = yields.find(y => y.product_id === pid && y.raw_material_id === rid);
    try {
        if (found) { if (val > 0) await DB.update('recipeYields', found.id, { ...found, units_per_product: val }); else await DB.del('recipeYields', found.id); }
        else if (val > 0) await DB.add('recipeYields', { product_id: pid, raw_material_id: rid, units_per_product: val });
        render('recipes');
    } catch(e) { showNotif('⚠️ ስህተት: ' + e.message, 'alert'); }
}

async function excludeMat(pid, rid) {
    try {
        const exclusions = DB.get('recipeExclusions');
        const found = exclusions.find(e => e.product_id === pid && e.raw_material_id === rid);
        if (!found) await DB.add('recipeExclusions', { product_id: pid, raw_material_id: rid });
        render('recipes');
    } catch(e) { showNotif('⚠️ ስህተት: ' + e.message, 'alert'); }
}

async function includeMat(pid, rid) {
    try {
        const exclusions = DB.get('recipeExclusions');
        const toDelete = exclusions.filter(e => e.product_id === pid && e.raw_material_id === rid);
        for (const e of toDelete) await DB.del('recipeExclusions', e.id);
        render('recipes');
    } catch(e) { showNotif('⚠️ ስህተት: ' + e.message, 'alert'); }
}

// ==================== PROFIT ====================
async function renderProfit(c) {
    await DB.loadAll();
    const prods = DB.get('products');
    const orders = DB.get('orders');
    const raw = DB.get('rawMaterials');
    const data = [];
    for (const p of prods) {
        const yields = DB.get('recipeYields').filter(y => y.product_id === p.id);
        let cost = 0;
        for (const y of yields) {
            const rm = raw.find(r => r.id === y.raw_material_id);
            if (rm && y.units_per_product > 0) cost += (rm.last_price || rm.unitPrice) * (1 / y.units_per_product);
        }
        const sold = orders.filter(o => o.product_id === p.id && o.status !== 'voided');
        const qty = sold.reduce((s,o) => s + o.quantity, 0);
        const rev = sold.reduce((s,o) => s + (o.base_price || 0) * o.quantity, 0);
        const pm = p.base_price - cost;
        data.push({ ...p, sold: qty, revenue: rev, cost, profit: pm, percent: p.base_price > 0 ? (pm / p.base_price * 100) : 0 });
    }
    data.sort((a,b) => b.revenue - a.revenue);
    let html = '<div class="card"><h3>📈 ትርፍ ትንተና</h3>';
    const totalProfit = data.reduce((s, p) => s + p.profit * p.sold, 0);
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">ጠቅላላ ትርፍ: <strong style="color:var(--ok);">${totalProfit.toFixed(2)} ብር</strong></div>`;
    data.forEach(p => {
        const cl = p.percent > 50 ? 'var(--ok)' : p.percent > 30 ? 'var(--warn)' : 'var(--bad)';
        html += `<div class="item"><div class="left"><span class="name">${p.name}</span><span class="sub">${p.sold} ተሽጧል</span></div>
            <div class="right"><span style="color:${cl};font-weight:700;">${(p.profit * p.sold).toFixed(2)} ብር</span><br><span style="font-size:10px;color:${cl};">${p.percent.toFixed(1)}%</span></div></div>`;
    });
    html += '</div>';
    c.innerHTML = html;
}

// ==================== BREAKEVEN ====================
async function renderBreakeven(c) {
    await DB.loadAll();
    const prods = DB.get('products');
    const orders = DB.get('orders');
    const raw = DB.get('rawMaterials');
    const purchases = DB.get('purchases');
    const settings = DB.find('settings', 'settings') || { fixedCosts: 50000, totalCapital: 200000 };
    let fixed = settings.fixedCosts || 50000;
    let capital = settings.totalCapital || 200000;
    let revenue = 0, rawCost = 0;
    for (const p of prods) {
        const yields = DB.get('recipeYields').filter(y => y.product_id === p.id);
        let costPerUnit = 0;
        for (const y of yields) {
            const rm = raw.find(r => r.id === y.raw_material_id);
            if (rm && y.units_per_product > 0) costPerUnit += (rm.last_price || rm.unitPrice) * (1 / y.units_per_product);
        }
        const sold = orders.filter(o => o.product_id === p.id && o.status !== 'voided');
        revenue += sold.reduce((s,o) => s + (o.base_price || 0) * o.quantity, 0);
        rawCost += sold.reduce((s,o) => s + costPerUnit * o.quantity, 0);
    }
    const tp = purchases.reduce((s,p) => s + (p.quantity || 0) * (p.price || 0), 0);
    const netProfit = revenue - rawCost - fixed;
    c.innerHTML = `<div class="card"><h3>💰 Break-even</h3>
        <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
            <input class="input" style="flex:1;min-width:80px;margin:0;" id="breakFixed" value="${fixed}" placeholder="ቋሚ ወጪ" type="number">
            <input class="input" style="flex:1;min-width:80px;margin:0;" id="breakCapital" value="${capital}" placeholder="ካፒታል" type="number">
            <button class="btn btn-primary btn-sm" onclick="updateBreakevenWithCaptcha()">💾</button>
        </div>
        <div class="grid-2"><div class="stat-card"><div class="stat-label">ጠቅላላ ገቢ</div><div class="stat-value">${fmt(revenue)} ብር</div></div>
            <div class="stat-card"><div class="stat-label">ጠቅላላ ወጪ</div><div class="stat-value">${fmt(rawCost + fixed)} ብር</div></div>
        </div>
        <div class="profit-card"><div style="font-size:12px;color:var(--muted);">ተጣራ ትርፍ</div>
        <div class="amount" style="color:${netProfit >= 0 ? 'var(--ok)' : 'var(--bad)'};">${fmt(netProfit)} ብር</div>
        ${netProfit > 0 ? `<div style="font-size:12px;color:var(--muted);">ካፒታል የሚመለስበት: ${(capital / netProfit).toFixed(1)} ወር</div>` : ''}
    </div></div>`;
}

const updateBreakevenWithCaptcha = function() {
    const f = parseFloat(document.getElementById('breakFixed').value) || 50000;
    const c = parseFloat(document.getElementById('breakCapital').value) || 200000;
    showCaptchaModal(async () => {
        try {
            let s = DB.find('settings', 'settings');
            if (s) await DB.update('settings', 'settings', { ...s, fixedCosts: f, totalCapital: c });
            else await DB.add('settings', { fixedCosts: f, totalCapital: c });
            showNotif('✅ ተቀምጧል', 'success');
            render('breakeven');
        } catch(e) { showNotif('⚠️ ስህተት: ' + e.message, 'alert'); }
    });
};

const saveProductWithCaptcha = function(id) {
    const name = document.getElementById('editName').value;
    const price = parseFloat(document.getElementById('editPrice').value);
    const cat = document.getElementById('editCat').value;
    const dest = document.getElementById('editDest').value;
    const tags = document.getElementById('editTags').value.split(',').map(t => t.trim()).filter(Boolean);
    const video = document.getElementById('editVideo').value;
    const prepTime = parseInt(document.getElementById('editPrep').value) || 0;
    const temperature = parseInt(document.getElementById('editTemp').value) || 0;
    const instructions = document.getElementById('editInstructions').value;
    const fileInput = document.getElementById('editImage');
    const file = fileInput?.files[0];
    if (!name || !price) { showNotif('⚠️ ስም እና ዋጋ ያስገቡ', 'alert'); return; }
    showCaptchaModal(async () => {
        try {
            await DB.update('products', id, { name, base_price: price, category_id: cat, destination: dest, tags, video_url: video, prep_time: prepTime, temperature, instructions });
            if (file && isOnline) { const url = await uploadImage(file, `products/${id}.jpg`); if (url) await DB.update('products', id, { image_data: url }); }
            await logActivity(currentUserId, 'product_edit', `${name} ተስተካክሏል`);
            showNotif('✅ ተስተካክሏል', 'success');
            goBack();
        } catch(e) { showNotif('⚠️ ስህተት: ' + e.message, 'alert'); }
    }, { id: id });
};

const deleteProductWithCaptcha = function(id) {
    if (!confirm('እርግጠኛ ነዎት? ይህ ምርት ይሰረዛል')) return;
    showCaptchaModal(async () => {
        try { await DB.del('products', id); showNotif('✅ ተሰርዟል', 'success'); goBack(); }
        catch(e) { showNotif('⚠️ ስህተት: ' + e.message, 'alert'); }
    }, { id: id });
};

const registerCustomerWithCaptcha = function() {
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    const address = document.getElementById('custAddress').value;
    const birthday = document.getElementById('custBirthday').value;
    if (!name || !phone) { showNotif('⚠️ ስም እና ስልክ ቁጥር ያስገቡ', 'alert'); return; }
    showCaptchaModal(async () => {
        await DB.loadAll();
        const existing = DB.get('customers').find(c => c.phone === phone);
        if (existing) {
            if (confirm(`👤 ይህ ስልክ ቁጥር (${phone}) ቀድሞ ተመዝግቧል። መግባት ይፈልጋሉ?`)) {
                currentCustomerId = existing.id;
                LocalDB.save('customer', { id: existing.id, name: existing.name, phone: existing.phone });
                showNotif('✅ እንኳን ደህና መጡ!', 'success');
                goBack(); return;
            }
            return;
        }
        try {
            const id = await DB.add('customers', { name, phone, address, birthday, created_at: new Date().toISOString(), loyaltyPoints: 0 });
            currentCustomerId = id;
            LocalDB.save('customer', { id, name, phone });
            showNotif('✅ ተመዝግበዋል!', 'success');
            goBack();
        } catch(e) { showNotif('⚠️ ስህተት: ' + e.message, 'alert'); }
    });
};

// ==================== NOTICES ====================
async function renderNotices(c) {
    await DB.loadAll();
    const notices = DB.get('notices').sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    let html = `<div class="card"><h3>📢 ማስታወቂያዎች</h3>`;
    if (['admin','manager'].includes(role)) {
        html += `
            <input class="input" id="noticeTitle" placeholder="ርዕስ">
            <textarea class="input" id="noticeMsg" placeholder="መልእክት" rows="2"></textarea>
            <select class="input" id="noticePriority">
                <option value="normal">🟢 መደበኛ</option>
                <option value="high">🟡 አስፈላጊ</option>
                <option value="urgent">🔴 አስቸኳይ</option>
            </select>
            <button class="btn btn-primary btn-block" onclick="createNotice()">📤 ላክ</button>
        `;
    }
    html += `</div>`;

    if (notices.length === 0) {
        html += `<div class="card" style="text-align:center;padding:16px;color:var(--muted);">ምንም ማስታወቂያ የለም</div>`;
    } else {
        notices.slice(0, 10).forEach(n => {
            const priorityClass = n.priority === 'urgent' ? 'notice-urgent' : n.priority === 'high' ? 'notice-high' : n.priority === 'normal' ? 'notice-normal' : 'notice-low';
            const priorityLabel = n.priority === 'urgent' ? '🔴' : n.priority === 'high' ? '🟡' : n.priority === 'normal' ? '🟢' : '🔵';
            html += `<div class="card ${priorityClass}">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <strong>${priorityLabel} ${n.title}</strong>
                    <small style="color:var(--muted);font-size:10px;">${new Date(n.created_at).toLocaleString()}</small>
                </div>
                <p style="font-size:13px;color:var(--muted);margin-top:4px;">${n.message}</p>
                <div style="font-size:10px;color:var(--brand2);">👤 ${n.created_by || 'ያልታወቀ'}</div>
            </div>`;
        });
        if (notices.length > 10) {
            html += `<div style="text-align:center;color:var(--muted);font-size:11px;">+ ${notices.length - 10} ተጨማሪ</div>`;
        }
    }
    c.innerHTML = html;
}

async function createNotice() {
    const title = document.getElementById('noticeTitle').value;
    const message = document.getElementById('noticeMsg').value;
    const priority = document.getElementById('noticePriority').value;
    if (!title || !message) { showNotif('⚠️ ርዕስ እና መልእክት ያስገቡ', 'alert'); return; }
    await DB.add('notices', { title, message, priority, created_at: new Date().toISOString(), created_by: currentUserName || 'አስተዳዳሪ' });
    await logActivity(currentUserId, 'notice_create', `${title} ተልኳል`);
    showNotif('✅ ማስታወቂያ ተልኳል', 'success');
    render('notices');
}

                <input class="input" id="expCategory" placeholder="ምድብ (ኪራይ, ውሃ...)" style="flex:1;min-width:100px;margin:0;">
                <input class="input" id="expAmount" placeholder="መጠን" type="number" style="flex:1;min-width:70px;margin:0;">
                <input class="input" id="expDesc" placeholder="መግለጫ" style="flex:1;min-width:100px;margin:0;">
                <button class="btn btn-primary" onclick="addExpense()">➕</button>
            </div>
            <div style="font-size:12px;color:var(--muted);">ዛሬ: <strong style="color:var(--bad);">${todayTotal.toFixed(2)} ብር</strong></div>
        </div>
        <div class="card"><h3>📊 በምድብ</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
                ${Object.entries(categories).map(([cat, total]) => `
                    <div style="padding:6px 10px;background:var(--s3);border-radius:10px;font-size:12px;">
                        <span style="color:var(--muted);">${cat}</span>
                        <span style="color:var(--bad);float:right;font-weight:700;">${total.toFixed(2)}</span>
                    </div>
                `).join('')}
            </div>
        </div>
        <div class="card"><h3>📋 ታሪክ</h3>
    `;

    expenses.slice(0, 20).forEach(e => {
        html += `<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;">
            <span style="color:var(--bad);font-weight:700;">${e.amount.toFixed(2)} ብር</span>
            <span style="color:var(--muted);">${e.category}</span>
            ${e.description ? `<span style="color:var(--muted);">- ${e.description}</span>` : ''}
            <small style="color:var(--muted2);float:right;">${e.date || ''}</small>
        </div>`;
    });
    html += '</div>';
    c.innerHTML = html;
}

async function addExpense() {
    const category = document.getElementById('expCategory').value;
    const amount = parseFloat(document.getElementById('expAmount').value);
    const description = document.getElementById('expDesc').value;
    if (!category || !amount) { showNotif('⚠️ ምድብ እና መጠን ያስገቡ', 'alert'); return; }
    await DB.add('expenses', { category, amount, description, date: new Date().toISOString().split('T')[0], created_at: new Date().toISOString() });
    await logActivity(currentUserId, 'expense_add', `${category} ${amount} ብር`);
    showNotif('✅ ወጪ ተመዝግቧል', 'success');
    render('expenses');
}

// ==================== ATTENDANCE ====================
async function renderAttendance(c) {
    if (!['admin','manager'].includes(role)) {
        c.innerHTML = '<div class="card">⛔ ፈቃድ የለም</div>';
        return;
    }
    await DB.loadAll();
    const today = new Date().toISOString().split('T')[0];
    const attendance = DB.get('attendance').filter(a => a.date === today);
    const users = DB.get('users').filter(u => ['server','cashier','kitchen','bar','pastry'].includes(u.role));

    let html = `
        <div class="card"><h3>📋 የዛሬ ምዝገባ</h3>
            <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">${getEthDate()}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;">
                <div style="color:var(--muted);">ስም</div>
                <div style="color:var(--muted);">ገቢ</div>
                <div style="color:var(--muted);">ወጪ</div>
                ${users.map(u => {
                    const record = attendance.find(a => a.user_id === u.id);
                    return `
                        <div>${u.full_name}</div>
                        <div>${record ? '✅' : '❌'}</div>
                        <div>${record && record.clock_out ? '✅' : '-'}</div>
                    `;
                }).join('')}
            </div>
        </div>
        <div class="card"><h3>⏱️ የስራ ሰአት መዝግብ</h3>
            <select class="input" id="attUser">
                ${users.map(u => `<option value="${u.id}">${u.full_name}</option>`).join('')}
            </select>
            <div style="display:flex;gap:6px;">
                <button class="btn btn-success btn-block" onclick="clockIn()">✅ ገቢ</button>
                <button class="btn btn-danger btn-block" onclick="clockOut()">❌ ወጪ</button>
            </div>
        </div>
    `;
    c.innerHTML = html;
}

async function clockIn() {
    const userId = document.getElementById('attUser').value;
    await DB.add('attendance', { user_id: userId, date: new Date().toISOString().split('T')[0], clock_in: new Date().toISOString() });
    await logActivity(currentUserId, 'clock_in', `${userId} ገብቷል`);
    showNotif('✅ ገብተዋል', 'success');
    render('attendance');
}

async function clockOut() {
    const userId = document.getElementById('attUser').value;
    const today = new Date().toISOString().split('T')[0];
    const records = DB.get('attendance').filter(a => a.user_id === userId && a.date === today && !a.clock_out);
    if (records.length === 0) { showNotif('⚠️ ገብተው አልተገኙም', 'alert'); return; }
    await DB.update('attendance', records[0].id, { clock_out: new Date().toISOString() });
    await logActivity(currentUserId, 'clock_out', `${userId} ወጥቷል`);
    showNotif('✅ ወጥተዋል', 'success');
    render('attendance');
}

// ==================== HELPERS ====================
function showNotif(msg, type) {
    const n = document.getElementById('notif');
    n.textContent = msg;
    n.style.background = type === 'success' ? 'linear-gradient(135deg,#4a7c4e,#3a6a3f)' : type === 'alert' ? 'linear-gradient(135deg,#b5473a,#9a392d)' : 'linear-gradient(135deg,#5a3a22,#3a2517)';
    n.style.display = 'block';
    n.style.animation = 'none';
    n.offsetHeight;
    n.style.animation = 'slideDown 0.3s ease';
    clearTimeout(n._timer);
    n._timer = setTimeout(() => n.style.display = 'none', 2500);
}

function showModal(html) { document.getElementById('modalBox').innerHTML = html; document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ==================== CHECK URL ====================
function checkURL() {
    const params = new URLSearchParams(window.location.search);
    const t = params.get('table');
    if (t) { table = t; savedTable = t; showNotif(`✅ ጠረጴዛ ${t}`, 'success'); }
}
