<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f4ece1">
    <title>ዮም ካፌ v40 - ሙሉ ስርዓት</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Noto+Serif+Ethiopic:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg:#f4ece1; --bg2:#ebdfcf; --card:#fffaf2;
            --s2:rgba(70,42,24,0.07); --s3:rgba(70,42,24,0.04); --line:rgba(70,42,24,0.13);
            --ink:#2a1c14; --muted:#7a6656; --muted2:#a89583;
            --brand:#3a2517; --brand2:#8a5a36; --accent:#8a5a36; --cream:#fff7ec;
            --tint:rgba(138,90,54,0.10); --tint-line:rgba(138,90,54,0.28);
            --ok:#4a7c4e; --ok-bg:rgba(74,124,78,0.13);
            --bad:#b5473a; --bad-bg:rgba(181,71,58,0.11);
            --warn:#bf7a1c; --warn-bg:rgba(191,122,28,0.13);
            --serif:'Fraunces','Noto Serif Ethiopic',Georgia,serif;
            --sans:'Inter','Noto Sans Ethiopic',system-ui,sans-serif;
            --shadow:0 6px 22px rgba(58,37,23,0.10);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:var(--sans); background:var(--bg); color:var(--ink); }
        h1,h2,h3 { font-family:var(--serif); font-weight:600; letter-spacing:-0.2px; }

        /* HEADER */
        .header { background:rgba(244,236,225,0.88); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; border-bottom:1px solid var(--line); }
        .header h1 { font-size:18px; font-weight:700; color:var(--brand); }
        .header-btn { background:var(--card); border:1px solid var(--line); color:var(--muted); width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .header-back { background:none; border:none; color:var(--brand); font-size:24px; cursor:pointer; padding:0 8px 2px; display:none; line-height:1; }
        .header-left { display:flex; align-items:center; gap:2px; }

        /* STAFF TABS */
        .tabs { display:flex; overflow-x:auto; padding:6px 10px; gap:6px; background:var(--bg); border-bottom:1px solid var(--line); }
        .tabs::-webkit-scrollbar { display:none; }
        .tab { padding:6px 13px; border-radius:999px; font-size:12px; font-weight:500; cursor:pointer; color:var(--muted); background:var(--card); border:1px solid var(--line); white-space:nowrap; transition:0.2s; }
        .tab.active { background:var(--brand); color:var(--cream); border-color:var(--brand); }

        .content { padding:12px 12px 120px; max-width:640px; margin:0 auto; }
        .page { display:none; }
        .page.active { display:block; animation:fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        /* CARDS */
        .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:10px; box-shadow:0 1px 0 rgba(255,255,255,0.6) inset; }
        .card h3 { font-size:16px; margin-bottom:6px; color:var(--brand); }
        .item { display:flex; justify-content:space-between; align-items:center; padding:9px 11px; background:var(--s3); border:1px solid transparent; border-radius:12px; margin-bottom:5px; cursor:pointer; transition:0.15s; }
        .item:active { transform:scale(0.98); background:var(--s2); }
        .item .name { font-weight:600; font-size:13px; }
        .item .price { color:var(--accent); font-weight:700; font-size:13px; }
        .item .sub { font-size:11px; color:var(--muted); }
        .item .left { display:flex; flex-direction:column; gap:2px; flex:1; }
        .item .right { text-align:right; }

        /* BUTTONS */
        .btn { padding:8px 16px; border:none; border-radius:999px; font-weight:600; font-size:12px; cursor:pointer; transition:0.2s; font-family:var(--sans); }
        .btn:active { transform:scale(0.97); }
        .btn-primary { background:var(--brand); color:var(--cream); }
        .btn-success { background:var(--ok); color:#fff; }
        .btn-danger { background:var(--bad); color:#fff; }
        .btn-secondary { background:var(--s2); color:var(--ink); border:1px solid var(--line); }
        .btn-warning { background:var(--warn); color:#fff; }
        .btn-sm { padding:4px 10px; font-size:11px; }
        .btn-block { width:100%; margin-top:4px; }
        .input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:13px; margin-bottom:5px; outline:none; font-family:var(--sans); }
        .input:focus { border-color:var(--brand2); box-shadow:0 0 0 3px rgba(138,90,54,0.15); }
        .input::placeholder { color:var(--muted2); }
        select.input { appearance:auto; }

        .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
        .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }

        .table-item { aspect-ratio:1; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-weight:700; font-size:14px; border:1.5px solid transparent; transition:0.15s; }
        .table-item.available { background:var(--ok-bg); border-color:rgba(74,124,78,0.35); color:var(--ok); }
        .table-item.occupied { background:var(--bad-bg); border-color:rgba(181,71,58,0.3); color:var(--bad); cursor:not-allowed; opacity:0.7; }
        .table-item .num { font-family:var(--serif); font-size:20px; font-weight:700; }
        .table-item .label { font-size:9px; color:var(--muted); font-weight:500; }

        .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:600; }
        .badge-pending { background:var(--warn-bg); color:var(--warn); }
        .badge-progress { background:var(--tint); color:var(--brand2); }
        .badge-ready { background:var(--ok-bg); color:var(--ok); }
        .badge-occupied { background:var(--bad-bg); color:var(--bad); }
        .badge-available { background:var(--ok-bg); color:var(--ok); }
        .badge-urgent { background:var(--bad-bg); color:var(--bad); }

        .qr-box { background:#fff; padding:12px; border-radius:16px; text-align:center; margin:6px 0; display:flex; flex-direction:column; align-items:center; border:1px solid var(--line); }
        .qr-box canvas { width:140px !important; height:140px !important; }
        .qr-box .num { font-family:var(--serif); font-size:18px; font-weight:700; color:var(--brand); margin-top:6px; }

        /* MODAL */
        .modal { display:none; position:fixed; inset:0; background:rgba(42,28,20,0.55); backdrop-filter:blur(6px); z-index:1000; padding:14px; align-items:center; justify-content:center; }
        .modal.show { display:flex; }
        .modal-box { background:var(--card); border-radius:24px; padding:18px; max-width:400px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(42,28,20,0.35); }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .modal-header h3 { font-size:18px; color:var(--brand); }
        .close { background:var(--s2); border:none; font-size:18px; color:var(--muted); cursor:pointer; width:30px; height:30px; border-radius:50%; }
        .notif { position:fixed; top:14px; left:50%; transform:translateX(-50%); padding:9px 18px; border-radius:999px; font-size:12px; font-weight:600; z-index:2000; display:none; animation:slideDown 0.3s ease; color:#fff; box-shadow:var(--shadow); max-width:90vw; text-align:center; }
        @keyframes slideDown { from { opacity:0; transform:translate(-50%,-40px); } to { opacity:1; transform:translate(-50%,0); } }

        /* LOADING */
        .loading { display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:10px; background:var(--bg); }
        .loading .logo { font-family:var(--serif); font-size:26px; font-weight:700; color:var(--brand); letter-spacing:1px; }
        .loading .bar { width:140px; height:3px; background:var(--s2); border-radius:2px; overflow:hidden; }
        .loading .bar-inner { height:100%; width:0%; background:linear-gradient(90deg,var(--brand2),var(--brand)); border-radius:2px; transition:width 0.3s; }
        .loading .text { font-size:12px; color:var(--muted); }

        /* STAFF CART BAR */
        .bottom { position:fixed; bottom:10px; left:10px; right:10px; max-width:600px; margin:0 auto; background:var(--brand); color:var(--cream); border-radius:999px; padding:8px 8px 8px 18px; display:flex; justify-content:space-between; align-items:center; z-index:100; box-shadow:var(--shadow); font-weight:600; font-size:13px; }
        .bottom .btn-primary { background:var(--cream); color:var(--brand); }

        /* CUSTOMER BOTTOM NAV */
        .custnav { position:fixed; bottom:10px; left:10px; right:10px; max-width:520px; margin:0 auto; background:rgba(255,250,242,0.94); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:30px; padding:6px 8px; display:none; justify-content:space-around; align-items:flex-end; z-index:100; box-shadow:0 10px 30px rgba(58,37,23,0.18); }
        .navbtn { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; border-radius:20px; color:var(--muted); font-size:10px; font-weight:600; cursor:pointer; transition:0.2s; }
        .navbtn .ni { font-size:19px; line-height:1.1; }
        .navbtn.on { color:var(--brand); }
        .navbtn.on .ni { transform:translateY(-1px); }
        .navcart { position:relative; flex:0 0 64px; height:64px; margin-top:-26px; border-radius:50%; background:linear-gradient(145deg,#5a3a22,#2a1c14); color:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; font-weight:600; cursor:pointer; box-shadow:0 8px 20px rgba(42,28,20,0.4); border:4px solid var(--bg); }
        .navcart .ni { font-size:22px; line-height:1; }
        .navcart .cbadge { position:absolute; top:-2px; right:-2px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--bad); color:#fff; font-size:11px; font-weight:700; display:none; align-items:center; justify-content:center; border:2px solid var(--bg); }

        /* LOCK / LOGIN */
        .lock { display:flex; align-items:center; justify-content:center; min-height:70vh; padding:12px; }
        .lock-box { max-width:320px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:26px 20px; text-align:center; box-shadow:var(--shadow); }
        .lock-box .icon { font-size:34px; margin-bottom:8px; }
        .lock-box h2 { font-size:20px; color:var(--brand); margin-bottom:2px; }
        .lock-box p { font-size:12px; color:var(--muted); margin-bottom:12px; }
        .lock-box select, .lock-box input[type=password], .lock-box input[type=text] { width:100%; padding:11px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--ink); font-size:14px; text-align:center; margin-bottom:6px; outline:none; font-family:var(--sans); }
        .lock-box select:focus, .lock-box input:focus { border-color:var(--brand2); }
        .lock-btn { width:100%; padding:11px; border:none; border-radius:999px; background:var(--brand); color:var(--cream); font-size:14px; font-weight:700; cursor:pointer; font-family:var(--sans); }
        .lock-error { color:var(--bad); font-size:12px; margin-bottom:6px; }

        .product-img { width:100%; aspect-ratio:1; border-radius:14px; background:linear-gradient(135deg,#e9d9c3,#d9bf9f); display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:3px; overflow:hidden; }
        .product-img img { width:100%; height:100%; object-fit:cover; }
        .search-box { position:relative; margin-bottom:6px; }
        .search-box .input { padding-left:34px; border-radius:999px; margin-bottom:0; }
        .search-box .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted2); font-size:14px; }
        .img-preview { display:none; margin-bottom:3px; }
        .img-preview img { width:100%; max-height:80px; object-fit:cover; border-radius:8px; }
        .file-upload { display:inline-block; padding:7px 14px; background:var(--s2); border-radius:999px; cursor:pointer; border:1px solid var(--line); font-size:12px; color:var(--ink); }
        .recipe-row { display:flex; align-items:center; gap:5px; margin:3px 0; flex-wrap:wrap; font-size:12px; }
        .recipe-row .rname { min-width:60px; color:var(--muted); }
        .recipe-row input { width:50px; padding:4px 6px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font-size:11px; }
        .exclude-btn { width:20px; height:20px; border-radius:50%; background:var(--bad-bg); border:1px solid rgba(181,71,58,0.4); color:var(--bad); cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center; }
        .include-chip { display:inline-block; padding:3px 9px; background:var(--tint); border:1px dashed var(--brand2); border-radius:999px; color:var(--brand2); font-size:10px; cursor:pointer; margin:1px; }
        .filter-chip { display:inline-block; padding:5px 12px; background:var(--card); border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:11px; cursor:pointer; margin:2px; transition:0.2s; }
        .filter-chip.active { background:var(--brand); color:var(--cream); border-color:var(--brand); }
        .profit-card { background:linear-gradient(160deg,#fff3dd,#f3e1c2); border:1px solid var(--tint-line); border-radius:18px; text-align:center; padding:14px 10px; margin-top:8px; }
        .profit-card .amount { font-family:var(--serif); font-size:28px; font-weight:700; color:var(--ok); }
        .loyalty-card { background:linear-gradient(145deg,#4a2f1c,#2a1c14); color:var(--cream); border-radius:22px; padding:18px; text-align:center; margin-bottom:10px; }
        .loyalty-points { font-family:var(--serif); font-size:40px; font-weight:700; color:#f0c987; }
        .stat-card { background:var(--s3); padding:10px 8px; border-radius:14px; text-align:center; border:1px solid var(--line); }
        .stat-value { font-family:var(--serif); font-size:17px; font-weight:700; color:var(--brand); }
        .stat-label { font-size:10px; color:var(--muted); letter-spacing:0.3px; }
        .cost-badge { display:flex; align-items:center; gap:6px; background:var(--ok-bg); border:1px solid rgba(74,124,78,0.3); border-radius:10px; padding:4px 8px; font-size:10px; color:var(--muted); margin-top:3px; flex-wrap:wrap; }
        .skeleton { background:linear-gradient(90deg,var(--s3) 25%,var(--s2) 50%,var(--s3) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:18px; border:none; }
        @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
        .online-status { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:3px; }
        .online-status.online { background:var(--ok); }
        .online-status.offline { background:var(--bad); }
        .captcha-box { background:var(--s3); border:1px solid var(--line); border-radius:16px; padding:14px; text-align:center; margin-bottom:10px; }
        .captcha-box .captcha-image { font-size:30px; letter-spacing:8px; font-weight:800; color:var(--brand); background:#fff; padding:10px; border-radius:12px; font-family:'Courier New',monospace; user-select:none; border:1px dashed var(--tint-line); }
        .captcha-box .captcha-input { width:140px; text-align:center; margin:6px auto; }
        .captcha-box .captcha-refresh { cursor:pointer; font-size:18px; }
        .captcha-box .captcha-attempts { font-size:11px; color:var(--muted); margin-top:3px; }
        .captcha-box .captcha-error { color:var(--bad); font-size:12px; margin-top:4px; }
        .server-sales { border-left:4px solid var(--brand2); }
        .server-sales .total { color:var(--accent); font-weight:700; }
        .table-locked { background:var(--bad-bg); border:1px solid rgba(181,71,58,0.25); padding:7px 10px; border-radius:10px; font-size:11px; color:var(--bad); margin-top:6px; }
        .special-card { background:linear-gradient(135deg,#f6dfb8,#efcf9a); border:1px solid rgba(138,90,54,0.35); border-radius:18px; padding:12px 16px; margin-bottom:10px; color:var(--brand); }
        .chart-container { width:100%; height:210px; position:relative; }
        .tier-badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; }
        .tier-bronze { background:rgba(138,90,43,0.15); color:#8a5a2b; }
        .tier-silver { background:rgba(107,107,107,0.15); color:#6b6b6b; }
        .tier-gold { background:rgba(166,124,0,0.16); color:#a67c00; }
        .tier-diamond { background:rgba(45,125,149,0.15); color:#2d7d95; }
        .product-tag { display:inline-block; padding:1px 8px; border-radius:999px; background:var(--tint); border:1px solid var(--tint-line); font-size:9px; color:var(--brand2); margin:1px; }
        .notice-urgent { border-left:4px solid var(--bad); }
        .notice-high { border-left:4px solid var(--warn); }
        .notice-normal { border-left:4px solid var(--brand2); }
        .notice-low { border-left:4px solid var(--ok); }
        .share-btn { background:var(--card); border:1px solid var(--line); border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; transition:0.2s; }
        .share-btn:active { background:var(--s2); }
        .recommendation-card { background:var(--tint); border-radius:14px; padding:8px; margin:2px 0; }
        .comparison-table { width:100%; font-size:12px; border-collapse:collapse; }
        .comparison-table th, .comparison-table td { padding:6px 7px; border-bottom:1px solid var(--line); text-align:left; }
        .comparison-table th { color:var(--muted); font-weight:600; }
        .comparison-table .highlight { color:var(--accent); font-weight:700; }
        .settings-group { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
        .video-container { position:relative; width:100%; padding-bottom:56.25%; margin:6px 0; }
        .video-container iframe { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:14px; }
        .instructions-box { background:var(--tint); border:1px solid var(--tint-line); border-radius:12px; padding:10px; font-size:12px; color:var(--muted); white-space:pre-wrap; margin:4px 0; }
        .order-timer { padding:2px 8px; border-radius:999px; font-size:10px; font-weight:600; }
        .order-timer.green { background:var(--ok-bg); color:var(--ok); }
        .order-timer.yellow { background:var(--warn-bg); color:var(--warn); }
        .order-timer.red { background:var(--bad-bg); color:var(--bad); }
        .priority-tag { display:inline-block; padding:1px 7px; border-radius:6px; font-size:9px; font-weight:600; }
        .priority-tag.urgent { background:var(--bad-bg); color:var(--bad); }
        .priority-tag.high { background:var(--warn-bg); color:var(--warn); }

        /* ============ NEW: HERO / STORE FRONT ============ */
        .hero { position:relative; overflow:hidden; border-radius:26px; padding:24px 20px 16px; margin-bottom:12px; color:var(--cream); background:radial-gradient(120% 100% at 85% 0%,#7a4e2d 0%,#3a2517 55%,#241710 100%); background-size:cover; background-position:center; box-shadow:var(--shadow); }
        .hero .kicker { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#e8c99b; font-weight:600; }
        .hero h2 { font-size:34px; line-height:1.08; margin:8px 0 6px; font-weight:700; max-width:75%; }
        .hero h2 em { font-style:italic; color:#f0c987; font-weight:500; }
        .hero p { font-size:13px; color:rgba(255,247,236,0.82); max-width:70%; line-height:1.55; }
        .hero .hero-cup { position:absolute; right:-6px; top:14px; font-size:92px; opacity:0.95; filter:drop-shadow(0 10px 18px rgba(0,0,0,0.35)); }
        .hero .hero-cta { display:flex; gap:8px; margin:14px 0 14px; flex-wrap:wrap; }
        .hero .hero-cta .btn { padding:10px 18px; }
        .hero .btn-light { background:var(--cream); color:var(--brand); }
        .hero .btn-ghost { background:rgba(255,247,236,0.12); color:var(--cream); border:1px solid rgba(255,247,236,0.3); }
        .hero-stats { display:flex; gap:0; border-top:1px solid rgba(255,247,236,0.18); padding-top:12px; }
        .hero-stats div { flex:1; text-align:left; padding:0 10px; border-left:1px solid rgba(255,247,236,0.18); }
        .hero-stats div:first-child { padding-left:0; border-left:none; }
        .hero-stats b { display:block; font-family:var(--serif); font-size:18px; }
        .hero-stats span { font-size:10px; color:rgba(255,247,236,0.7); }

// ==================== DATABASE ====================
const DB = {
    data: {}, loaded: false,
    async loadAll() {
        if (this.loaded) return;
        const cols = ['categories','products','tables','orders','sessions','users','shifts','rawMaterials','purchases','recipeYields','feedback','loyalty','waste','customers','recipeExclusions','settings','serverSales','notices','activity_logs','expenses','attendance','product_history','restaurant_ratings','cash_reports','product_links','notifications','product_images','takeaway_orders','holidays','shift_notes','fridge_items','gallery','recipe_videos','security_questions','restaurant_settings','filtered_payments','order_priorities'];
        await Promise.all(cols.map(async c => {
            try {
                const snap = await firestore.collection(c).get();
                this.data[c] = [];
                snap.forEach(d => this.data[c].push({ id: d.id, ...d.data() }));
            } catch(e) { this.data[c] = []; }
        }));
        this.loaded = true;
    },
    get(c) { return this.data[c] || []; },
    find(c, id) { return this.get(c).find(i => i.id === id); },
    async add(c, d) {
        const ref = await firestore.collection(c).add({ ...d, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        if (!this.data[c]) this.data[c] = [];
        this.data[c].push({ id: ref.id, ...d });
        return ref.id;
    },
    async update(c, id, d) {
        await firestore.collection(c).doc(id).update(d);
        const i = this.data[c].findIndex(x => x.id === id);
        if (i > -1) this.data[c][i] = { ...this.data[c][i], ...d };
    },
    async del(c, id) {
        await firestore.collection(c).doc(id).delete();
        this.data[c] = this.data[c].filter(x => x.id !== id);
    }
};

function getEthDate() {
    const now = new Date();

    return `${days[eth.getUTCDay()]} ${eth.getUTCDate()} ${months[eth.getUTCMonth()]} ${eth.getUTCFullYear()+7}`;
}

function hashPassword(pass) {
    let hash = 0;
    for (let i = 0; i < pass.length; i++) {
        hash = (hash << 5) - hash + pass.charCodeAt(i);
        hash = hash & hash;
    }
    return hash.toString();
}

// ==================== OFFLINE SYNC ====================
async function saveOffline(key, data) {
    const pending = LocalDB.get('pending') || [];
    pending.push({ key, data, timestamp: Date.now(), id: 'pending_' + Date.now() });
    LocalDB.save('pending', pending);
    showNotif('💾 ውሂብ በአካባቢ ተቀምጧል (ኢንተርኔት የለም)', 'alert');
}

async function syncOffline() {
    const pending = LocalDB.get('pending') || [];
    if (pending.length === 0 || !isOnline) return;
    let synced = 0;
    for (const item of pending) {
        try {
            await DB.add(item.key, item.data);
            synced++;
        } catch(e) {
            console.error('Sync error:', e);
        }
    }
    if (synced > 0) {
        LocalDB.remove('pending');
        showNotif(`✅ ${synced} ውሂቦች ተመሳስለዋል`, 'success');
    }
}

// ==================== CAPTCHA SYSTEM ====================
const CaptchaSystem = {
    currentCode: '',
    currentText: '',
    attempts: 0,
    maxAttempts: 3,
    isVerified: false,

    generateCaptcha() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let code = '';
        let text = '';
        for (let i = 0; i < 6; i++) {
            const randomIndex = Math.floor(Math.random() * chars.length);
            code += chars[randomIndex];
            text += chars[randomIndex] + ' ';
        }
        this.currentCode = code;
        this.currentText = text.trim();
        this.attempts = 0;
        this.isVerified = false;
        return this.currentText;
    },

    verify(input) {
        const isValid = input.toUpperCase() === this.currentCode;
        if (!isValid) this.attempts++;
        if (isValid) this.isVerified = true;
        return isValid;
    },

    refresh() {
        this.isVerified = false;
        return this.generateCaptcha();
    },

    isLocked() {
        return this.attempts >= this.maxAttempts;
    }
};

CaptchaSystem.generateCaptcha();

// ==================== CAPTCHA MODAL ====================
function showCaptchaModal(callback, context = {}) {
    if (CaptchaSystem.isVerified) {
        if (callback) callback(context);
        return;
    }

    const captchaText = CaptchaSystem.refresh();
    const html = `
        <div class="modal-header"><h3>🔒 የሮቦቲክ ጥበቃ</h3><button class="close" onclick="closeModal()">&times;</button></div>

            <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">ከታች ያለውን ኮድ ያስገቡ</div>
            <div class="captcha-image" id="captchaDisplay">${captchaText}</div>
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;">
                <input class="input captcha-input" id="captchaInput" placeholder="ኮድ ያስገቡ" style="width:150px;text-align:center;font-size:16px;letter-spacing:4px;text-transform:uppercase;margin:0;" maxlength="6" autocomplete="off">
                <span class="captcha-refresh" onclick="refreshCaptcha()" style="font-size:22px;cursor:pointer;">🔄</span>
            </div>
            <div class="captcha-error" id="captchaError"></div>
            <div class="captcha-attempts" id="captchaAttempts">ሙከራ: ${CaptchaSystem.attempts}/${CaptchaSystem.maxAttempts}</div>
        </div>
        <button class="btn btn-primary btn-block" id="captchaSubmitBtn" style="padding:11px;">✅ አረጋግጥ</button>
    `;
    showModal(html);

    document.getElementById('captchaSubmitBtn').onclick = function() {
        if (CaptchaSystem.isLocked()) {
            document.getElementById('captchaError').textContent = '❌ ከመጠን በላይ ሙከራ!';
            return;
        }
        const input = document.getElementById('captchaInput').value;
        if (CaptchaSystem.verify(input)) {
            closeModal();
            if (callback) callback(context);
        } else {
            document.getElementById('captchaError').textContent = '❌ ኮዱ ትክክል አይደለም!';
            document.getElementById('captchaInput').value = '';
            document.getElementById('captchaInput').focus();
            document.getElementById('captchaAttempts').textContent = `ሙከራ: ${CaptchaSystem.attempts}/${CaptchaSystem.maxAttempts}`;
            if (CaptchaSystem.isLocked()) {
                document.getElementById('captchaError').textContent = '❌ ከመጠን በላይ ሙከራ!';
                document.getElementById('captchaSubmitBtn').disabled = true;
                document.getElementById('captchaSubmitBtn').style.opacity = '0.5';
            }
            setTimeout(() => {
                const newText = CaptchaSystem.refresh();
                document.getElementById('captchaDisplay').textContent = newText;
            }, 500);
        }
    };

    document.getElementById('captchaInput').onkeypress = function(e) {
        if (e.key === 'Enter') {
            document.getElementById('captchaSubmitBtn').click();
        }
    };

    setTimeout(() => {
        document.getElementById('captchaInput').focus();
    }, 100);
}

function refreshCaptcha() {
    const newText = CaptchaSystem.refresh();
    const display = document.getElementById('captchaDisplay');
    if (display) display.textContent = newText;
    const input = document.getElementById('captchaInput');
    if (input) { input.value = ''; input.focus(); }
    const error = document.getElementById('captchaError');
    if (error) error.textContent = '';
    const attempts = document.getElementById('captchaAttempts');
    if (attempts) attempts.textContent = `ሙከራ: ${CaptchaSystem.attempts}/${CaptchaSystem.maxAttempts}`;
}

// ==================== ORDER TIMER ====================
function getOrderTime(orderId) {
    const order = DB.find('orders', orderId);
    if (!order) return null;
    const created = new Date(order.created_at);
    const now = new Date();
    return Math.floor((now - created) / 60000);
}

function getOrderColor(minutes) {
    if (minutes < 5) return '#4a7c4e';
    if (minutes < 15) return '#bf7a1c';
    return '#b5473a';
}

function getOrderTimerClass(minutes) {
    if (minutes < 5) return 'green';
    if (minutes < 15) return 'yellow';
    return 'red';
}

// ==================== STOCK ALERTS ====================
function checkStockAlerts() {
    const items = DB.get('rawMaterials');
    const alerts = [];
    items.forEach(item => {
        if (item.current_stock <= 0) {
            alerts.push(`❌ ${item.name} አልቋል!`);
            const products = DB.get('products').filter(p => {
                const yields = DB.get('recipeYields').filter(y => y.product_id === p.id && y.raw_material_id === item.id);
                return yields.length > 0;
            });
            products.forEach(p => {
                DB.update('products', p.id, { is_86: 1 });
            });
        } else if (item.current_stock <= (item.alert_threshold || 5)) {
            alerts.push(`⚠️ ${item.name} ይጠናቀቃል (${item.current_stock} ቀርቷል)`);
        }
    });
    return alerts;
}

// ==================== SEARCH OPTIMIZATION ====================
function searchProducts(query, categoryId = null) {
    let results = DB.get('products').filter(p => !p.is_86);
    if (categoryId) results = results.filter(p => p.category_id === categoryId);
    if (query) {
        const q = query.toLowerCase();
        results = results.filter(p =>
            p.name.toLowerCase().includes(q) ||
            (p.tags && p.tags.some(t => t.toLowerCase().includes(q)))
        );
    }
    return results;
}

// ==================== REPORT SUMMARY ====================
function getReportSummary(date) {
    const sessions = DB.get('sessions').filter(s =>
        s.closed_at && s.closed_at.startsWith(date) && s.status === 'closed'
    );
    const orders = DB.get('orders').filter(o => o.created_at && o.created_at.startsWith(date));
    const products = DB.get('products');
    const productSales = {};
    orders.forEach(o => {
        productSales[o.product_name] = (productSales[o.product_name] || 0) + o.quantity;
    });
    const topProducts = Object.entries(productSales).sort((a,b) => b[1] - a[1]).slice(0, 5);
    const paymentMethods = {};
    sessions.forEach(s => {
        const method = s.payment_method || 'ጥሬ ገንዘብ';
        paymentMethods[method] = (paymentMethods[method] || 0) + (s.total_amount || 0);
    });
    return {
        totalSales: sessions.reduce((s, se) => s + (se.total_amount || 0), 0),
        totalOrders: sessions.length,
        averageOrder: sessions.length > 0 ?
            sessions.reduce((s, se) => s + (se.total_amount || 0), 0) / sessions.length : 0,
        topProducts,
        paymentMethods,
        orderCount: orders.length,
        itemCount: orders.reduce((s, o) => s + o.quantity, 0)
    };
}

// ==================== CHARTS ====================
async function renderCharts(c) {
    await DB.loadAll();
    const sessions = DB.get('sessions').filter(s => s.status === 'closed' && s.closed_at);
    const today = new Date().toISOString().split('T')[0];

    const dailySales = {};
    for (let i = 29; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const key = date.toISOString().split('T')[0];
        const daySales = sessions.filter(s => s.closed_at && s.closed_at.startsWith(key));
        dailySales[key] = daySales.reduce((sum, s) => sum + (s.total_amount || 0), 0);
    }

    const orders = DB.get('orders').filter(o => o.status !== 'voided');
    const productSales = {};
    orders.forEach(o => {
        productSales[o.product_name] = (productSales[o.product_name] || 0) + o.quantity;
    });
    const topProducts = Object.entries(productSales).sort((a,b) => b[1] - a[1]).slice(0, 10);

    const paymentMethods = {};
    sessions.forEach(s => {
        const method = s.payment_method || 'ጥሬ ገንዘብ';
        paymentMethods[method] = (paymentMethods[method] || 0) + (s.total_amount || 0);
    });

    let html = `
        <div class="card"><h3>📈 የሽያጭ ግራፎች</h3>
            <p style="font-size:11px;color:var(--muted);">የ30 ቀን ሽያጭ አዝማሚያ</p>
            <div class="chart-container"><canvas id="salesChart"></canvas></div>
        </div>
        <div class="card"><h3>🏆 ከፍተኛ የተሸጡ ምርቶች</h3>
            <div class="chart-container"><canvas id="productChart"></canvas></div>
        </div>
        <div class="card"><h3>💳 የክፍያ ዘዴዎች</h3>
            <div class="chart-container"><canvas id="paymentChart"></canvas></div>
        </div>
    `;
    c.innerHTML = html;

    const palette = ['#5a3a22', '#8a5a36', '#c79a64', '#4a7c4e', '#b5473a', '#bf7a1c'];
    const legend = { labels: { color: '#7a6656', font: { size: 10 } } };
    const axes = { x: { ticks: { color: '#7a6656', font: { size: 8 } }, grid: { color: 'rgba(70,42,24,0.08)' } }, y: { ticks: { color: '#7a6656', font: { size: 8 } }, grid: { color: 'rgba(70,42,24,0.08)' } } };

    setTimeout(() => {
        const ctx1 = document.getElementById('salesChart');
        if (ctx1) {
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: Object.keys(dailySales).map(d => d.slice(5)),
                    datasets: [{
                        label: 'ዕለታዊ ሽያጭ (ብር)',
                        data: Object.values(dailySales),
                        borderColor: '#8a5a36',
                        backgroundColor: 'rgba(138,90,54,0.14)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend }, scales: axes }
            });
        }
        const ctx2 = document.getElementById('productChart');
        if (ctx2) {
            new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: topProducts.map(p => p[0]),
                    datasets: [{
                        label: 'ተሽጧል',
                        data: topProducts.map(p => p[1]),
                        backgroundColor: palette,
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend }, scales: axes }
            });
        }
        const ctx3 = document.getElementById('paymentChart');
        if (ctx3) {
            new Chart(ctx3, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(paymentMethods),
                    datasets: [{
                        data: Object.values(paymentMethods),
                        backgroundColor: ['#5a3a22', '#c79a64', '#4a7c4e']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend } }
            });
        }
    }, 200);
}

// ==================== COMPARISON ====================
async function renderComparison(c) {
    await DB.loadAll();
    const prods = DB.get('products').filter(p => !p.is_86);
    const raw = DB.get('rawMaterials');
    const orders = DB.get('orders').filter(o => o.status !== 'voided');

    const data = prods.map(p => {
        const yields = DB.get('recipeYields').filter(y => y.product_id === p.id);
        let cost = 0;
        for (const y of yields) {
            const rm = raw.find(r => r.id === y.raw_material_id);
            if (rm && y.units_per_product > 0) {
                cost += (rm.last_price || rm.unitPrice) * (1 / y.units_per_product);
            }
        }
        const sold = orders.filter(o => o.product_id === p.id);
        const qty = sold.reduce((s,o) => s + o.quantity, 0);
        const revenue = sold.reduce((s,o) => s + (o.base_price || 0) * o.quantity, 0);
        const profit = p.base_price - cost;
        return { ...p, cost, profit, margin: p.base_price > 0 ? (profit / p.base_price * 100) : 0, qty, revenue };
    });

    data.sort((a,b) => b.margin - a.margin);
    const maxMargin = data.length > 0 ? data[0].margin : 0;
    const minMargin = data.length > 0 ? data[data.length-1].margin : 0;
    const totalProfit = data.reduce((s, d) => s + d.profit * d.qty, 0);

    let html = `
        <div class="card"><h3>📊 የምርት ማነጻጸሪያ</h3>
            <p style="font-size:11px;color:var(--muted);">በትርፍ ክፍያ ቅደም ተከተል</p>
            <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">ጠቅላላ ትርፍ: <strong style="color:var(--ok);">${totalProfit.toFixed(2)} ብር</strong></div>
            <div style="overflow-x:auto;">
                <table class="comparison-table">
                    <thead>
                        <tr><th>ምርት</th><th>ዋጋ</th><th>ወጪ</th><th>ትርፍ</th><th>ክፍያ</th><th>ተሽጧል</th></tr>
                    </thead>
                    <tbody>
                        ${data.map(d => `
                            <tr>
                                <td>${d.name}</td>
                                <td class="highlight">${d.base_price.toFixed(2)}</td>
                                <td style="color:var(--bad);">${d.cost.toFixed(2)}</td>
                                <td style="color:${d.margin > 50 ? 'var(--ok)' : d.margin > 30 ? 'var(--warn)' : 'var(--bad)'};">${d.profit.toFixed(2)}</td>
                                <td style="color:${d.margin > 50 ? 'var(--ok)' : 'var(--warn)'};">${d.margin.toFixed(1)}%</td>
                                <td>${d.qty}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            <div style="margin-top:8px;font-size:11px;color:var(--muted);">
                🏆 ከፍተኛ ትርፍ: ${data.length > 0 ? data.find(d => d.margin === maxMargin)?.name : '-'} (${maxMargin.toFixed(1)}%)
                <br>📉 ዝቅተኛ ትርፍ: ${data.length > 0 ? data.find(d => d.margin === minMargin)?.name : '-'} (${minMargin.toFixed(1)}%)
            </div>
        </div>
    `;
    c.innerHTML = html;
}

async function renderTakeaway(c) {
    await DB.loadAll();
    const prods = DB.get('products').filter(p => !p.is_86);

    let html = `
        <div class="section-head" style="margin-top:4px;"><div><div class="eyebrow">ከቤት ሆነው ያዝዙ</div><h2>Takeaway.</h2></div></div>

            <div style="margin-top:8px;">
                <input class="input" id="takeawayName" placeholder="ስም">
                <input class="input" id="takeawayPhone" placeholder="ስልክ ቁጥር">
            </div>
            <div class="pgrid" style="margin-top:6px;" id="takeawayMenu">
                ${prods.slice(0, 12).map(p => productCard(p, p.base_price*1.15, `addTakeawayItem('${p.id}','${p.name}',${p.base_price*1.15})`, `<button class="padd" onclick="event.stopPropagation();addTakeawayItem('${p.id}','${p.name}',${p.base_price*1.15})">+</button>`)).join('')}
            </div>
            <div id="takeawayCart" style="margin-top:10px;font-size:12px;"></div>
            <button class="btn btn-success btn-block" style="padding:11px;" onclick="submitTakeaway()">✅ ትዕዛዝ ላክ</button>
        </div>
        <div class="card"><h3>📋 የTakeaway ታሪክ</h3>
    `;

    const takeawayOrders = DB.get('takeaway_orders').sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    if (takeawayOrders.length === 0) html += '<p style="color:var(--muted);font-size:12px;">ምንም የለም</p>';
    else {
        takeawayOrders.slice(0, 10).forEach(o => {
            html += `<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;">
                <span>${o.customer_name} - ${o.items ? o.items.length : 0} ምርቶች</span>
                <span style="color:var(--accent);font-weight:700;float:right;">${o.total.toFixed(2)} ብር</span>
                <div style="color:var(--muted);font-size:11px;">${o.status || 'በመጠበቅ'}</div>
            </div>`;
        });
    }
    html += '</div>';
    c.innerHTML = html;

    window._takeawayCart = [];
    window.addTakeawayItem = function(id, name, price) {
        const ex = window._takeawayCart.find(i => i.id === id);
        if (ex) ex.qty++;
        else window._takeawayCart.push({ id, name, price, qty: 1 });
        updateTakeawayCart();
    };
    window.updateTakeawayCart = function() {
        const container = document.getElementById('takeawayCart');
        if (!container) return;
        if (window._takeawayCart.length === 0) { container.innerHTML = ''; return; }
        const total = window._takeawayCart.reduce((s, i) => s + i.price * i.qty, 0);
        container.innerHTML = window._takeawayCart.map((i, idx) => `
            <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);">
                <span>${i.qty}x ${i.name}</span>
                <span>${(i.price * i.qty).toFixed(2)} ብር <button onclick="removeTakeawayItem(${idx})" style="color:var(--bad);background:none;border:none;cursor:pointer;">✕</button></span>
            </div>
        `).join('') + `<div style="font-weight:700;margin-top:6px;">ጠቅላላ: ${total.toFixed(2)} ብር</div>`;
    };
    window.removeTakeawayItem = function(idx) {
        window._takeawayCart.splice(idx, 1);
        updateTakeawayCart();
    };
    window.submitTakeaway = async function() {
        if (window._takeawayCart.length === 0) { showNotif('⚠️ ምርት ይምረጡ', 'alert'); return; }
        const name = document.getElementById('takeawayName').value || 'ያልታወቀ';
        const phone = document.getElementById('takeawayPhone').value || '-';
        const total = window._takeawayCart.reduce((s, i) => s + i.price * i.qty, 0);
        const data = {
            customer_name: name,
            customer_phone: phone,
            items: window._takeawayCart.map(i => ({ id: i.id, name: i.name, qty: i.qty, price: i.price })),
            total: total,
            status: 'pending',
            created_at: new Date().toISOString()
        };
        if (!isOnline) {
            await saveOffline('takeaway_orders', data);
            window._takeawayCart = [];
            updateTakeawayCart();
            showNotif('💾 ትዕዛዝ በአካባቢ ተቀምጧል (ኢንተርኔት የለም)', 'alert');
            return;
        }
        await DB.add('takeaway_orders', data);
        window._takeawayCart = [];
        updateTakeawayCart();
        showNotif('✅ ትዕዛዝ ተልኳል! ለማንሳት ይምጡ', 'success');
        render('takeaway');
    };
}

async function renderHolidays(c) {

        return;
    }
    await DB.loadAll();
    const holidays = DB.get('holidays');

    let html = `
        <div class="card"><h3>🎉 በዓላት አስተዳደር</h3>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <input class="input" id="holidayName" placeholder="የበዓል ስም" style="flex:1;min-width:100px;margin:0;">
                <input class="input" id="holidayDate" placeholder="ቀን (MM-DD)" style="flex:1;min-width:100px;margin:0;">
                <input class="input" id="holidayDiscount" placeholder="ቅናሽ %" type="number" style="flex:1;min-width:70px;margin:0;">
                <button class="btn btn-primary" onclick="addHoliday()">➕</button>
            </div>
        </div>
        <div class="card"><h3>📋 የተመዘገቡ በዓላት</h3>
    `;

    if (holidays.length === 0) html += '<p>ምንም የለም</p>';
    else {
        const today = new Date();
        holidays.forEach(h => {
            const key = h.date;
            const holidayDate = new Date(today.getFullYear(), parseInt(key.split('-')[0])-1, parseInt(key.split('-')[1]));
            const daysLeft = Math.ceil((holidayDate - today) / (1000 * 60 * 60 * 24));
            html += `<div style="padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;">
                <span>${h.name} <span style="color:var(--muted);">${h.date}</span></span>
                <span style="color:var(--accent);">${h.discount}% ቅናሽ</span>
                <span style="color:${daysLeft > 0 ? 'var(--ok)' : 'var(--bad)'};">${daysLeft > 0 ? `በ${daysLeft} ቀን` : 'ዛሬ!'}</span>
                <button class="btn btn-sm btn-danger" onclick="deleteHoliday('${h.id}')">🗑️</button>
            </div>`;
        });
    }
    html += '</div>';
    c.innerHTML = html;
}

async function addHoliday() {
    const name = document.getElementById('holidayName').value;
    const date = document.getElementById('holidayDate').value;
    const discount = parseFloat(document.getElementById('holidayDiscount').value) || 0;
    if (!name || !date) { showNotif('⚠️ ስም እና ቀን ያስገቡ', 'alert'); return; }
    await DB.add('holidays', { name, date, discount });
    showNotif('✅ በዓል ተመዝግቧል', 'success');
    render('holidays');
}

async function deleteHoliday(id) {
    if (!confirm('እርግጠኛ ነዎት?')) return;
    await DB.del('holidays', id);
    render('holidays');
}

function getActiveHoliday() {
    const today = new Date();
    const key = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const holidays = DB.get('holidays');
    return holidays.find(h => h.date === key) || null;

function shareMessage(message) {
    if (navigator.share) {
        navigator.share({
            title: 'ዮም ካፌ',
            text: message,
            url: window.location.href
        }).catch(() => {});
    } else {
        navigator.clipboard.writeText(message).then(() => {
            showNotif('✅ መልእክቱ ተቀድቷል!', 'success');
        }).catch(() => {
            const textarea = document.createElement('textarea');
            textarea.value = message;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showNotif('✅ መልእክቱ ተቀድቷል!', 'success');
        });
    }
}

async function renderCash(c) {

            </div>
        </div>
        <div class="card"><h3>📋 የቀን ሪፖርቶች</h3>
    `;

    const allReports = DB.get('cash_reports').sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    if (allReports.length === 0) html += '<p>ምንም የለም</p>';
    else {
        allReports.slice(0, 10).forEach(r => {

            </div>`;
        });
    }
    html += '</div>';
    c.innerHTML = html;
}

async function submitCashReport() {
    const startCash = parseFloat(document.getElementById('cashStart').value);
    const endCash = parseFloat(document.getElementById('cashEnd').value);
    if (isNaN(startCash) || isNaN(endCash)) { showNotif('⚠️ ሁለቱንም ያስገቡ', 'alert'); return; }
    const today = new Date().toISOString().split('T')[0];
    const todaySales = DB.get('sessions').filter(s => s.closed_at && s.closed_at.startsWith(today) && s.status === 'closed');
    const totalSales = todaySales.reduce((s, se) => s + (se.total_amount || 0), 0);
    const expectedCash = startCash + totalSales;
    await DB.add('cash_reports', {
        date: today,
        start_cash: startCash,
        end_cash: endCash,
        total_sales: totalSales,
        expected_cash: expectedCash,
        difference: expectedCash - endCash,
        created_at: new Date().toISOString()
    });
    showNotif('✅ ገንዘብ ተመዝግቧል', 'success');
    render('cash');
}

async function backupData() {
    await DB.loadAll();
    const collections = ['categories','products','tables','orders','sessions','users','shifts','rawMaterials','purchases','recipeYields','feedback','loyalty','waste','customers','recipeExclusions','settings','serverSales','notices','activity_logs','expenses','attendance','product_history','restaurant_ratings','cash_reports','takeaway_orders','holidays','fridge_items','gallery','security_questions','restaurant_settings','order_priorities'];
    const backup = {};
    for (const col of collections) {
        backup[col] = DB.get(col);
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showNotif('✅ ውሂብ ተወርዷል', 'success');
}

async function restoreData(event) {
    const file = event.target.files[0];
    if (!file) return;
    try {
        const text = await file.text();
        const data = JSON.parse(text);
        let count = 0;
        for (const [col, items] of Object.entries(data)) {
            if (!items || !Array.isArray(items)) continue;
            for (const item of items) {
                try {
                    const existing = DB.find(col, item.id);
                    if (!existing) {
                        await DB.add(col, item);
                        count++;
                    }
                } catch(e) { /* skip duplicates */ }
            }
        }
        showNotif(`✅ ${count} ውሂቦች ተመልሰዋል`, 'success');
        DB.loaded = false;
        await DB.loadAll();
        render('backup');
    } catch(e) {
        showNotif('⚠️ ስህተት: ' + e.message, 'alert');
    }
}

async function renderRecommendations(c) {
    if (!currentCustomerId) {
        c.innerHTML = `<div class="card" style="text-align:center;padding:20px;"><div style="font-size:40px;">👤</div><h3>እባክዎ ይመዝገቡ</h3><button class="btn btn-primary" style="margin-top:8px;" onclick="goTo('customerRegister')">👤 ይመዝገቡ</button></div>`;
        return;
    }
    await DB.loadAll();
    const sessions = DB.get('sessions').filter(s => s.customer_id === currentCustomerId);
    const previousOrders = DB.get('orders').filter(o =>
        sessions.some(s => s.id === o.session_id) && o.status !== 'voided'
    );

    const frequency = {};
    previousOrders.forEach(o => {
        frequency[o.product_id] = (frequency[o.product_id] || 0) + o.quantity;
    });
    const popular = Object.entries(frequency).sort((a,b) => b[1] - a[1]).slice(0, 3);

    const allProducts = DB.get('products').filter(p => !p.is_86);
    const recommendations = [];
    const uniqueIds = new Set();
    popular.forEach(([productId]) => {
        const product = allProducts.find(p => p.id === productId);
        if (product) {
            const sameCategory = allProducts.filter(p =>
                p.category_id === product.category_id &&
                p.id !== productId &&
                !frequency[p.id]
            );
            for (const p of sameCategory) {
                if (!uniqueIds.has(p.id) && recommendations.length < 5) {
                    uniqueIds.add(p.id);
                    recommendations.push(p);
                }
            }
        }
    });

    const topSelling = allProducts.sort((a,b) => {
        const aSold = DB.get('orders').filter(o => o.product_id === a.id && o.status !== 'voided').length;
        const bSold = DB.get('orders').filter(o => o.product_id === b.id && o.status !== 'voided').length;
        return bSold - aSold;
    }).slice(0, 5);

    const cardFor = p => productCard(p, p.base_price*1.15, `showProductOptions('${p.id}','${p.name}',${p.base_price*1.15})`, `<button class="padd" onclick="event.stopPropagation();addToCart('${p.id}','${p.name}',${p.base_price*1.15})">+</button>`);

    let html = `
        <div class="section-head" style="margin-top:4px;"><div><div class="eyebrow">ለእርስዎ</div><h2>ሊወዱት ይችላሉ.</h2></div></div>
        ${recommendations.length > 0 ? `<div class="pgrid">${recommendations.map(cardFor).join('')}</div>` : '<div class="card"><p style="color:var(--muted);font-size:12px;">ተጨማሪ ምክሮች ለማግኘት ተጨማሪ ትዕዛዞችን ያዝዙ</p></div>'}
        <div class="section-head"><div><div class="eyebrow">ተወዳጅ</div><h2>በብዛት የሚታዘዙ.</h2></div></div>
        <div class="pgrid">${topSelling.map(cardFor).join('')}</div>
    `;
    c.innerHTML = html;
}

        'Thursday': { name: 'የሓሙስ ልዩ', dish: 'ጥላች', price: 100 },

let searchQuery = '';
let categoryFilter = '';

function filterProducts(query) {
    searchQuery = query;
    renderProductGrid();
}

function setCategory(id) {
    categoryFilter = id || '';
    document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('on', (ch.dataset.cat || '') === categoryFilter));
    renderProductGrid();
}

function renderProductGrid() {
    const grid = document.getElementById('menuGrid');
    if (!grid) return;
    const query = searchQuery || '';
    const catId = categoryFilter || '';
    const prods = searchProducts(query, catId);
    if (prods.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:24px;color:var(--muted);font-size:13px;">🔍 ምንም ምርት አልተገኘም</div>'; return; }
    const holiday = getActiveHoliday();
    grid.innerHTML = prods.map(p => {
        let price = p.base_price * 1.15;
        if (holiday) price = price * (1 - holiday.discount / 100);
        return productCard(p, price, `showProductOptions('${p.id}','${p.name}',${price})`,
            `<button class="padd" onclick="event.stopPropagation();addToCart('${p.id}','${p.name}',${price})" aria-label="ጨምር">+</button>`);
    }).join('');
}

function callWaiter() { showNotif('🛎️ አስተናጋጅ ተጠርቷል!', 'alert'); }

// ==================== PRODUCT OPTIONS ====================
const orderModifiers = {
    'coffee': ['ትንሽ ስኳር', 'በጣም ትኩስ', 'ከወተት ጋር'],
    'tea': ['ትንሽ ስኳር', 'ከሎሚ ጋር', 'ቀምስ'],
    'pizza': ['ያለ ስጋ', 'ተጨማሪ አይብ', 'ቀጭን']
};

function showProductOptions(productId, name, price) {
    const modifiers = orderModifiers[productId] || [];
    const prod = DB.find('products', productId);
    const html = `
        <div class="modal-header"><h3>${name}</h3><button class="close" onclick="closeModal()">&times;</button></div>
        ${prod && prod.image_data ? `<div class="product-img" style="aspect-ratio:16/10;margin-bottom:10px;"><img src="${prod.image_data}" alt=""></div>` : ''}
        <div style="text-align:center;font-family:var(--serif);font-size:26px;font-weight:700;color:var(--brand);">${price.toFixed(2)} <small style="font-size:14px;">ብር</small></div>
        ${modifiers.length > 0 ? `
            <div style="margin:10px 0;">
                <div style="font-size:12px;color:var(--muted);">ልዩ ጥያቄዎች:</div>
                <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">
                    ${modifiers.map(m => `
                        <span class="filter-chip" onclick="toggleModifier('${m}')" id="mod_${m.replace(/\s/g,'_')}">${m}</span>
                    `).join('')}
                </div>
                <input class="input" id="customModifier" placeholder="ሌላ ጥያቄ..." style="font-size:12px;margin-top:6px;">
            </div>
        ` : ''}
        <div style="display:flex;gap:6px;margin-top:12px;">
            <button class="btn btn-secondary" onclick="closeModal()">ተመልስ</button>
            <button class="btn btn-primary btn-block" style="margin:0;padding:11px;" onclick="addToCartWithMods('${productId}','${name}',${price})">🛒 ጨምር</button>
        </div>
    `;
    showModal(html);
    window._selectedModifiers = [];
    window._productId = productId;
    window._productName = name;
    window._productPrice = price;
    window.toggleModifier = function(m) {
        const idx = window._selectedModifiers.indexOf(m);
        if (idx > -1) window._selectedModifiers.splice(idx, 1);
        else window._selectedModifiers.push(m);
        const el = document.getElementById('mod_' + m.replace(/\s/g,'_'));
        if (el) el.classList.toggle('active');
    };
    window.addToCartWithMods = function(id, name, price) {
        const custom = document.getElementById('customModifier')?.value || '';
        const mods = [...window._selectedModifiers];
        if (custom) mods.push(custom);
        addToCart(id, name, price, mods);
        closeModal();
    };
}

function addToCart(id, name, price, modifiers = []) {
    if (!table) { showNotif('⚠️ መጀመሪያ ጠረጴዛ ይምረጡ', 'alert'); return; }
    const ex = cart.find(i => i.id === id && JSON.stringify(i.modifiers || []) === JSON.stringify(modifiers));
    if (ex) ex.qty++;
    else cart.push({ id, name, price, qty: 1, modifiers });
    updateCart();
    showNotif(`${name} ${modifiers.length > 0 ? '('+modifiers.join(', ')+')' : ''} ተጨምሯል`, 'success');
}

function updateCart() {
    const tot = cart.reduce((s,i) => s + i.price * i.qty, 0);
    const cnt = cart.reduce((s,i) => s + i.qty, 0);
    // customer: badge on the centre button of the bottom navigation
    const badge = document.getElementById('cartBadge');
    if (badge) { badge.textContent = cnt; badge.style.display = cnt > 0 ? 'flex' : 'none'; }
    // staff: floating cart bar
    const b = document.getElementById('bottom');
    if (role === 'customer' || cart.length === 0 || !table) { b.style.display = 'none'; return; }
    document.getElementById('cartInfo').textContent = `🛒 ${cnt} | ${tot.toFixed(2)} ብር`;
    b.style.display = 'flex';
}

function showCart() {
    if (cart.length === 0) { showNotif('🛒 ቅርጫት ባዶ ነው', 'alert'); return; }
    const tot = cart.reduce((s,i) => s + i.price * i.qty, 0);
    let html = `<div class="modal-header"><h3>🛒 ቅርጫት</h3><button class="close" onclick="closeModal()">&times;</button></div>`;
    cart.forEach((item, i) => {
        const modStr = item.modifiers && item.modifiers.length > 0 ? ' ('+item.modifiers.join(', ')+')' : '';
        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;gap:6px;">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <button onclick="updateQty(${i}, -1)" style="background:var(--s2);border:1px solid var(--line);border-radius:50%;color:var(--ink);width:26px;height:26px;cursor:pointer;font-size:15px;">−</button>
                <span style="font-weight:700;min-width:14px;text-align:center;">${item.qty}</span>
                <button onclick="updateQty(${i}, 1)" style="background:var(--s2);border:1px solid var(--line);border-radius:50%;color:var(--ink);width:26px;height:26px;cursor:pointer;font-size:15px;">+</button>
                <span>${item.name}${modStr}</span>
            </div>
            <span style="white-space:nowrap;">${(item.price * item.qty).toFixed(2)} ብር <button onclick="removeFromCart(${i})" style="color:var(--bad);background:none;border:none;cursor:pointer;">✕</button></span>
        </div>`;
    });
    html += `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;"><span style="color:var(--muted);font-size:12px;">ጠቅላላ</span><span style="font-family:var(--serif);font-size:24px;font-weight:700;color:var(--brand);">${tot.toFixed(2)} ብር</span></div>`;
    html += `<button class="btn btn-primary btn-block" style="padding:12px;margin-top:10px;font-size:13px;" onclick="submitOrderWithCaptcha()">✅ ትዕዛዝ ላክ</button>`;
    showModal(html);
}

function updateQty(index, change) {
    if (cart[index].qty + change <= 0) cart.splice(index, 1);
    else cart[index].qty += change;
    updateCart();
    if (cart.length === 0) { closeModal(); return; }
    showCart();
}
function removeFromCart(i) { cart.splice(i, 1); updateCart(); if (cart.length === 0) { closeModal(); return; } showCart(); }

// ==================== SUBMIT ORDER ====================
const submitOrderWithCaptcha = function() {
    showCaptchaModal(async () => {
        if (!table || cart.length === 0) return;
        const sub = cart.reduce((s,i) => s + (i.price / 1.15) * i.qty, 0);
        const tax = sub * 0.15;
        const tot = sub + tax;
        const data = {
            table_number: table.toString(),
            status: 'active',
            subtotal: sub,
            tax_amount: tax,
            total_amount: tot,
            opened_at: new Date().toISOString(),
            customer_id: currentCustomerId,
            server_id: currentUserId,
            server_name: currentUserName
        };
        let sid;
        if (!isOnline) {
            await saveOffline('sessions', data);
            sid = 'offline_' + Date.now();
            showNotif('💾 ትዕዛዝ በአካባቢ ተቀምጧል (ኢንተርኔት የለም)', 'alert');
        } else {
            sid = await DB.add('sessions', data);
        }
        for (const item of cart) {
            const p = DB.find('products', item.id);
            const orderData = {
                session_id: sid,
                table_number: table.toString(),
                product_id: item.id,
                product_name: item.name + (item.modifiers && item.modifiers.length > 0 ? ' ('+item.modifiers.join(', ')+')' : ''),
                quantity: item.qty,
                base_price: item.price / 1.15,
                unit_price: item.price,
                destination: p ? p.destination : 'kitchen',
                status: 'pending',
                created_at: new Date().toISOString(),
                server_id: currentUserId,
                server_name: currentUserName,
                modifiers: item.modifiers || []
            };
            if (!isOnline) {
                await saveOffline('orders', orderData);
            } else {
                await DB.add('orders', orderData);
            }
        }
        await logActivity(currentUserId, 'order_created', `ለጠረጴዛ ${table} ${cart.length} ምርቶች`);
        cart = [];
        updateCart();
        closeModal();
        showNotif(isOnline ? '✅ ትዕዛዝ ተልኳል!' : '💾 ትዕዛዝ በአካባቢ ተቀምጧል', isOnline ? 'success' : 'alert');
        render('home');
    });
};

async function logActivity(userId, action, details) {
    try {
        const data = {
            user_id: userId || 'system',
            user_name: currentUserName || 'ስርዓት',
            action: action,

        };

                <div class="label">${occ ? (isMyTable ? 'የእርስዎ' : 'ተይዟል') : 'ባዶ'}</div>

            </div>`;
        }

    });
}

function selectTable(n) {
    table = n; savedTable = n;
    DB.loadAll().then(() => {
        const tables = DB.get('tables');
        let t = tables.find(t => t.table_number === n.toString());
        if (!t) {
            DB.add('tables', { table_number: n.toString(), status: 'occupied', occupied_by: currentUserId, occupied_by_name: currentUserName });
        } else if (t.status === 'available') {
            DB.update('tables', t.id, { status: 'occupied', occupied_by: currentUserId, occupied_by_name: currentUserName });
        } else if (t.status === 'occupied' && t.occupied_by !== currentUserId && role === 'customer') {
            showNotif('⚠️ ጠረጴዛው በሌላ ሰው ተይዟል', 'alert');
            table = null;
            savedTable = null;
            return;
        }
        showNotif(`✅ ጠረጴዛ ${n} ተመርጧል`, 'success');
        render('home');
    });
}

// ==================== STAFF LOGIN ====================
async function loginStaffWithCaptcha() {
    const roleVal = document.getElementById('staffRole').value;
    const pass = document.getElementById('staffPass').value;

    if (!pass) {
        document.getElementById('staffError').textContent = 'የይለፍ ቃል ያስገቡ';
        return;
    }

    await DB.loadAll();
    const users = DB.get('users');
    const user = users.find(u => u.role === roleVal);
    const hashed = hashPassword(pass);

    if (!user || (pass !== user.password && hashed !== user.password && !(roleVal === 'admin' && pass === 'admin123'))) {
        document.getElementById('staffError').textContent = 'የይለፍ ቃል ትክክል አይደለም';
        return;
    }

    showCaptchaModal(async () => {
        if (pass === user.password && pass !== 'admin123') {
            await DB.update('users', user.id, { ...user, password: hashed });
        }
        role = roleVal;
        currentUserId = user.id;
        currentUserRole = roleVal;
        currentUserName = user.full_name || roleVal;
        document.getElementById('tabs').style.display = 'flex';
        renderTabs();
        await logActivity(currentUserId, 'login', `በ${roleVal} ሚና ገብቷል`);
        goTo('dashboard');
        showNotif(`✅ እንኳን ደህና መጡ ${roleVal} ${currentUserName}`, 'success');
    }, { role: roleVal, user: user });
}

// ==================== ORDERS ====================
async function renderOrders(c) {
    await DB.loadAll();
    let orders = DB.get('orders').filter(o => !['delivered','voided'].includes(o.status));
    if (['kitchen','bar','pastry'].includes(role)) {
        const destMap = { kitchen: 'kitchen', bar: 'bar', pastry: 'pastry' };
        orders = orders.filter(o => o.destination === destMap[role]);
    }
    if (role === 'server') {
        orders = orders.filter(o => o.server_id === currentUserId);
    }
    orders.sort((a,b) => {
        if (a.priority === 'urgent' && b.priority !== 'urgent') return -1;
        if (b.priority === 'urgent' && a.priority !== 'urgent') return 1;
        if (a.priority === 'high' && b.priority === 'normal') return -1;
        if (b.priority === 'high' && a.priority === 'normal') return 1;
        return new Date(a.created_at) - new Date(b.created_at);
    });

    if (orders.length === 0) {
        c.innerHTML = '<div class="card" style="text-align:center;padding:24px;color:var(--muted);">📋 ምንም ንቁ ትዕዛዝ የለም</div>';
        return;
    }
    const groups = {};
    orders.forEach(o => { const k = o.session_id || '?'; if (!groups[k]) groups[k] = []; groups[k].push(o); });
    let html = '';
    for (const [sid, items] of Object.entries(groups)) {
        const tn = items[0].table_number || '?';
        const tot = items.reduce((s,o) => s + (o.unit_price || 0) * o.quantity, 0);
        const serverName = items[0].server_name || 'ያልታወቀ';
        const hasReady = items.some(o => o.status === 'ready');
        const allReady = items.every(o => o.status === 'ready');
        const destination = items[0].destination || 'kitchen';
        const hasUrgent = items.some(o => o.priority === 'urgent');

        html += `<div class="card" style="${hasUrgent ? 'border-left:4px solid var(--bad);' : ''}"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
            <h3 style="margin:0;font-size:16px;">🪑 ጠረጴዛ ${tn} ${hasUrgent ? '<span class="priority-tag urgent">🚨 አስቸኳይ</span>' : ''}</h3>
            <span style="color:var(--accent);font-weight:800;font-size:14px;">${tot.toFixed(2)} ብር</span>
        </div>
        <div style="font-size:11px;color:var(--brand2);margin-bottom:6px;">👨‍💼 ${serverName} ${destination === 'kitchen' ? '👨‍🍳' : destination === 'bar' ? '🍹' : '🍰'}</div>`;
        items.forEach(o => {
            const mins = getOrderTime(o.id);
            const cls = getOrderTimerClass(mins);
            const statusMap = { pending:'በመጠበቅ', in_progress:'በሂደት', ready:'ዝግጁ' };
            const badgeMap = { pending:'badge-pending', in_progress:'badge-progress', ready:'badge-ready' };
            const priorityTag = o.priority === 'urgent' ? ' <span class="priority-tag urgent">🚨</span>' : o.priority === 'high' ? ' <span class="priority-tag high">⚡</span>' : '';
            html += `<div class="item" onclick="goTo('order','${o.id}')"><div class="left"><span class="name">${o.quantity}x ${o.product_name}${priorityTag}</span>
                <span class="sub">${statusMap[o.status] || o.status} <span class="order-timer ${cls}">${mins} ደቂቃ</span></span></div>
                <div class="right"><span class="badge ${badgeMap[o.status] || 'badge-pending'}">${statusMap[o.status] || o.status}</span></div></div>`;
        });
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">';
        if (['kitchen','bar','pastry'].includes(role)) {
            if (!allReady && items.some(o => o.status !== 'ready')) {
                html += `<button class="btn btn-sm btn-primary" onclick="markAllReady('${sid}')">✅ ሁሉም ዝግጁ</button>`;
            }
            if (items.some(o => o.status === 'pending')) {
                html += `<button class="btn btn-sm btn-warning" onclick="setOrderPriority('${sid}','urgent')">🚨 አስቸኳይ</button>`;
            }
        }
        html += '</div>';
        if ((role === 'server' || role === 'cashier') && hasReady) {
            html += `<button class="btn btn-success btn-sm btn-block" style="padding:9px;" onclick="serveOrder('${sid}')">🍽️ አስረክብ</button>`;
        }
        if (role === 'server' || role === 'cashier') {
            html += `<button class="btn btn-primary btn-sm btn-block" style="padding:9px;" onclick="payWithCaptcha('${sid}')">💰 ክፍያ</button>`;
        }
        html += '</div>';
    }
    c.innerHTML = html;
}

async function setOrderPriority(sid, priority) {
    const orders = DB.get('orders').filter(o => o.session_id === sid);
    for (const o of orders) {
        await DB.update('orders', o.id, { priority });
    }
    showNotif(`✅ ቅድሚያ ${priority === 'urgent' ? 'አስቸኳይ' : 'ከፍተኛ'} ተቀምጧል`, 'success');
    render('orders');
}

async function markAllReady(sid) {
    const orders = DB.get('orders').filter(o => o.session_id === sid && o.status !== 'ready' && o.status !== 'delivered');
    for (const o of orders) {
        await DB.update('orders', o.id, { status: 'ready' });
    }
    showNotif('✅ ሁሉም ትዕዛዞች ዝግጁ ናቸው', 'success');
    render('orders');
}

async function serveOrder(sid) {
    const orders = DB.get('orders').filter(o => o.session_id === sid && o.status === 'ready');
    for (const o of orders) {
        await DB.update('orders', o.id, { status: 'delivered' });
    }
    showNotif('🍽️ ትዕዛዞች ተረክበዋል', 'success');
    render('orders');
}

// ==================== PAYMENT ====================
const payWithCaptcha = function(sid) {
    showCaptchaModal(async () => {
        await DB.loadAll();
        const orders = DB.get('orders').filter(o => o.session_id === sid && !['delivered','voided'].includes(o.status));
        if (orders.length === 0) return;
        let tot = orders.reduce((s,o) => s + (o.unit_price || 0) * o.quantity, 0);
        const free = Math.floor(tot / 500);
        let msg = `💰 ክፍያ: ${tot.toFixed(2)} ብር`;
        if (free > 0) msg += `\n☕ ${free} ነፃ ቡና`;
        if (!confirm(msg)) return;

        const holiday = getActiveHoliday();
        if (holiday) {
            const discount = tot * (holiday.discount / 100);
            if (confirm(`🎉 ${holiday.name} - ${holiday.discount}% ቅናሽ (${discount.toFixed(2)} ብር)`)) {
                tot = tot - discount;
            }
        }

        const method = prompt('የክፍያ ዘዴ ይምረጡ:\n1 - ጥሬ ገንዘብ\n2 - ቴሌብር\n3 - ካርድ');
        const methods = ['ጥሬ ገንዘብ', 'ቴሌብር', 'ካርድ'];
        const paymentMethod = methods[parseInt(method) - 1] || 'ጥሬ ገንዘብ';

        const sess = DB.find('sessions', sid);
        if (sess) {
            let finalAmount = free > 0 ? Math.max(0, tot - 25) : tot;

            if (sess.customer_id) {
                const loyalty = DB.get('loyalty');
                const found = loyalty.find(l => l.customer_id === sess.customer_id);
                if (found && found.points >= 10) {
                    const maxDiscount = Math.min(found.points, 50);
                    if (confirm(`⭐ ${found.points} ነጥብ አለዎት. ${maxDiscount} ብር ቅናሽ?`)) {
                        await DB.update('loyalty', found.id, { points: found.points - maxDiscount });
                        finalAmount = Math.max(0, finalAmount - maxDiscount);
                        showNotif(`✅ ${maxDiscount} ብር ቅናሽ`, 'success');
                    }
                }
            }

            const data = {
                status: 'closed',
                total_amount: finalAmount,
                closed_at: new Date().toISOString(),
                server_id: currentUserId,
                server_name: currentUserName,
                payment_method: paymentMethod
            };
            if (!isOnline) {
                await saveOffline('sessions_update', { id: sid, data });
            } else {
                await DB.update('sessions', sid, data);
            }

            const salesData = {
                server_id: currentUserId,
                server_name: currentUserName,
                session_id: sid,
                table_number: sess.table_number,
                amount: finalAmount,
                items: orders.length,
                date: new Date().toISOString().split('T')[0],
                created_at: new Date().toISOString()
            };
            if (!isOnline) {
                await saveOffline('serverSales', salesData);
            } else {
                await DB.add('serverSales', salesData);
            }

            const t = DB.get('tables').find(t => t.table_number === sess.table_number);
            if (t) {
                await DB.update('tables', t.id, {
                    status: 'available',
                    occupied_by: null,
                    occupied_by_name: null
                });
            }
            if (sess.table_number === table) { table = null; savedTable = null; }
            for (const o of orders) await DB.update('orders', o.id, { status: 'delivered' });

            if (sess.customer_id) {
                const pts = Math.floor(tot / 50);
                const loyalty = DB.get('loyalty');
                const found = loyalty.find(l => l.customer_id === sess.customer_id);
                if (found) await DB.update('loyalty', found.id, { points: (found.points || 0) + pts });
                else await DB.add('loyalty', { customer_id: sess.customer_id, points: pts });
            }

            await logActivity(currentUserId, 'payment', `ክፍያ ${finalAmount.toFixed(2)} ብር ለጠረጴዛ ${sess.table_number}`);

            if (confirm('📝 አስተያየት መስጠት ይፈልጋሉ?')) showFeedbackModal(sid);
            showNotif('✅ ክፍያ ተፈጽሟል! ጠረጴዛ ነፃ ሆኗል', 'success');
            goTo('orders');
        }
    }, { sid: sid });
};

function showFeedbackModal(sid) {
    let rating = 0;
    const html = `<div class="modal-header"><h3>💬 አስተያየት</h3><button class="close" onclick="closeModal()">&times;</button></div>
        <div style="text-align:center;"><p style="font-size:13px;color:var(--muted);">ደረጃ ይስጡ</p>
        <div style="display:flex;gap:6px;font-size:32px;justify-content:center;cursor:pointer;margin:8px 0;" id="fbStars">
            ${[1,2,3,4,5].map(i => `<span onclick="selectFB(${i})" style="color:#cbb9a6;transition:0.3s;">⭐</span>`).join('')}
        </div>
        <input class="input" id="fbComment" placeholder="አስተያየት (አማራጭ)">
        <button class="btn btn-primary btn-block" style="padding:11px;" onclick="submitFeedback('${sid}')">📤 ላክ</button></div>`;

    window.submitFeedback = async function(sid) {
        if (window._fbRating === 0) return alert('እባክዎ ደረጃ ይስጡ');
        const comment = document.getElementById('fbComment').value || '';
        const data = { session_id: sid, rating: window._fbRating, comment, created_at: new Date().toISOString() };
        if (!isOnline) {
            await saveOffline('feedback', data);
            await saveOffline('restaurant_ratings', { ...data, customer_id: currentCustomerId });
        } else {
            await DB.add('feedback', data);
            await DB.add('restaurant_ratings', { ...data, customer_id: currentCustomerId });

        closeModal();
        showNotif('✅ አስተያየት ተልኳል!', 'success');
    };
